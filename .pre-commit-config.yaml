default_install_hook_types:
- pre-commit
- pre-push

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: end-of-file-fixer
    stages: [pre-commit]
  - id: trailing-whitespace
    stages: [pre-commit]
  - id: check-yaml
    stages: [pre-commit]
  - id: debug-statements
    stages: [pre-push]

## Ruff
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.5
  hooks:
  - id: ruff
    args: [--fix]
    stages: [pre-commit]
  - id: ruff-format
    stages: [pre-commit]
