[project]
name = "ckanext-issues"
version = "0.0.1"
description = "A CKAN extension for managing and tracking issues within the CKAN interface."
readme = "README.md"
authors = [
    {name = "Oleksandr Cherniavskyi"}
]
license = {text = "AGPL"}
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

keywords = [ "CKAN", ]
requires-python = ">= 3.10"
dependencies = [
    "typing-extensions",
    "ckanext-tables",
]

[project.optional-dependencies]
test = ["pytest-ckan", "pytest-factoryboy"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings", "mkdocstrings-python"]

[project.urls]
Homepage = "https://github.com/DataShades/ckanext-issues"

[project.entry-points."ckan.plugins"]
issues = "ckanext.issues.plugin:IssuesPlugin"


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
filterwarnings = [
        "ignore::sqlalchemy.exc.SADeprecationWarning",
        "ignore::sqlalchemy.exc.SAWarning",
        "ignore::DeprecationWarning",
]
addopts = "--ckan-ini test.ini"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["ckanext/issues/migration"]

[tool.ruff.lint]
select = [
       "ALL"
]

ignore = [
       "D",
       "CPY",
       "ANN401", # we use a lot of Anys
       "RET503", # don't enforce return-None
       "E712", # comparison to bool: violated by SQLAlchemy filters
       "PLC1901", # simplify comparison to empty string: violated by SQLAlchemy filters
       "N999",
       "COM812", # missing trailing comma
       "TRY003", # CKAN's tk.Invalid/ValidationError/NotAuthorized carry the message
]

[tool.ruff.lint.per-file-ignores]
"ckanext/issues/tests*" = ["S", "PL", "ANN", "ARG"]
"ckanext/issues/signals.py" = ["ERA001", "ARG001"]
"ckanext/issues/mailer.py" = ["ARG001"]
"ckanext/issues/logic/auth.py" = ["ARG001"]
"ckanext/issues/logic/validators.py" = ["ARG001"]
"ckanext/issues/logic/*" = [
    "D417", # actions don't describe context and data_dict
]
"ckanext/issues/logic/schema.py" = [
    "PLR0913", # too many keyword arguments (validator_args injection)
    "PLR0917", # too many positional arguments (validator_args injection)
]
"ckanext/issues/model.py" = [
    "ARG002",
    "DTZ", # CKAN models store naive UTC datetimes
]

[tool.ruff.lint.flake8-import-conventions.aliases]
"ckan.plugins" = "p"
"ckan.plugins.toolkit" = "tk"
sqlalchemy = "sa"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
section-order = [
              "future",
              "standard-library",
              "first-party",
              "third-party",
              "ckan",
              "ckanext",
              "self",
              "local-folder",
]

[tool.ruff.lint.isort.sections]
ckan = ["ckan"]
ckanext = ["ckanext"]
self = ["ckanext.issues"]
