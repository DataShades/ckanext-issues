[project]
name = "ckanext-issues"
version = "0.0.1"
description = "A CKAN extension for managing and tracking issues within the CKAN interface."
readme = "README.md"
authors = [
    {name = "Oleksandr Cherniavskyi"}
]
license = {text = "AGPL"}
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

keywords = [ "CKAN", ]
requires-python = ">= 3.10"
dependencies = [
    "typing-extensions",
    "ckanext-tables",
]

[project.optional-dependencies]
test = ["pytest-ckan", "pytest-factoryboy"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings", "mkdocstrings-python"]

[project.urls]
Homepage = "https://github.com/DataShades/ckanext-issues"

[project.entry-points."ckan.plugins"]
issues = "ckanext.issues.plugin:IssuesPlugin"


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
filterwarnings = [
        "ignore::sqlalchemy.exc.SADeprecationWarning",
        "ignore::sqlalchemy.exc.SAWarning",
        "ignore::DeprecationWarning",
]
addopts = "--ckan-ini test.ini"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["ckanext/issues/migration"]

[tool.ruff.lint]
select = [
       "ANN0", # type annotations for function arguments
       "B",  # likely bugs and design problems
       "BLE",  # do not catch blind exception
       "C4",  # better list/set/dict comprehensions
       "C90",  # check McCabe complexity
       "DTZ", # enforce timezone in date objects
       "E",  # pycodestyle error
       "W",  # pycodestyle warning
       "F",  # pyflakes
       "FA", # verify annotations from future
       "G",  # format strings for logging statements
       "N",  # naming conventions
       "I",  # isort
       "ICN", # import conventions
       # "D1",  # require doc
       "D2",  # doc formatting
       "D4",  # doc convention
       "PL",  # pylint
       "PERF", # performance anti-patterns
       "PT",  # pytest style
       "PIE",  # misc lints
       "RET",  # improvements for return statements
       "RSE",  # improvements for rise statements
       "S",  # security testing
       "SIM",  # simplify code
       "T10",  # debugging statements
       "T20",  # print statements
       "TID",  # tidier imports
       "TRY",  # better exceptions
       "UP",  # upgrade syntax for newer versions of the language
]

ignore = [
       "RET503", # don't enforce return-None
       "E712", # comparison to bool: violated by SQLAlchemy filters
       "PLC1901", # simplify comparison to empty string: violated by SQLAlchemy filters
       "N999",
       "TRY003", # CKAN's tk.Invalid/ValidationError/NotAuthorized carry the message
]

[tool.ruff.lint.per-file-ignores]
"ckanext/issues/tests*" = ["S", "PL", "ANN"]
"ckanext/issues/logic/*" = [
            "D417", # actions don't describe context and data_dict
]
"ckanext/issues/logic/schema.py" = [
            "PLR0913", # too many keyword arguments (validator_args injection)
            "PLR0917", # too many positional arguments (validator_args injection)
]
"ckanext/issues/model.py" = [
            "DTZ", # CKAN models store naive UTC datetimes
]

[tool.ruff.lint.flake8-import-conventions.aliases]
"ckan.plugins" = "p"
"ckan.plugins.toolkit" = "tk"
sqlalchemy = "sa"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
section-order = [
              "future",
              "standard-library",
              "first-party",
              "third-party",
              "ckan",
              "ckanext",
              "self",
              "local-folder",
]

[tool.ruff.lint.isort.sections]
ckan = ["ckan"]
ckanext = ["ckanext"]
self = ["ckanext.issues"]
